
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>
        {% if projeto %}Editar Projeto{% else %}Novo Projeto{% endif %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #1f4e79;
            box-shadow: 0 0 0 2px rgba(31, 78, 121, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .botoes {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #1f4e79;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #163a5c;
        }

        .cancelar {
            flex: 1;
            padding: 12px;
            border-radius: 7px;
            background: #e5e5e5;
            color: #333;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .cancelar:hover {
            background: #d2d2d2;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            {% if projeto %}
                Editar Projeto
            {% else %}
                Novo Projeto
            {% endif %}
        </h1>

        <form method="POST">
            {% csrf_token %}

            <label>Nome:</label>
            <input type="text" name="nome" value="{{ projeto.nome|default:'' }}" required>

            <br><br>

            <label>Descrição:</label>
            <textarea name="descricao" required>{{ projeto.descricao|default:'' }}</textarea>

            <br><br>

            <label>Data de início:</label>
            <input type="date" name="data_inicio" value="{{ projeto.data_inicio|date:'Y-m-d' }}" required>

            <div class="botoes">
                <button type="submit">Salvar</button>

                <a href="{% url 'listar_projetos' %}" class="cancelar">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</body>
</html>
